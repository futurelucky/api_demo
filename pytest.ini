[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -s
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: 冒烟测试
    regression: 回归测试

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s